<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <h1>{{ 'auth.changePassword.title' | translate }}</h1>
  <p>{{ 'auth.changePassword.description' | translate }}</p>
  <div>
    <label>{{ 'auth.changePassword.newPassword' | translate }}</label>
    <input formControlName="newPassword" type="password" autocomplete="new-password" />
    @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
      <span>{{ 'auth.changePassword.minLength' | translate }}</span>
    }
  </div>
  @if (error()) {
    <p role="alert">{{ 'auth.changePassword.error' | translate }}</p>
  }
  <button type="submit" [disabled]="form.invalid || loading()">
    {{ 'auth.changePassword.submit' | translate }}
  </button>
</form>
