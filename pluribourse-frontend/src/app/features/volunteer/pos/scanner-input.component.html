<mat-form-field appearance="outline" class="scanner-field">
  <mat-label>{{ 'volunteer.pos.scanner.placeholder' | translate }}</mat-label>
  <input
    #scannerInput
    matInput
    type="text"
    [value]="buffer()"
    [disabled]="disabled()"
    (keydown)="onKeydown($event)"
    (paste)="onPaste($event)"
    [attr.aria-label]="'volunteer.pos.scanner.ariaLabel' | translate"
    autocomplete="off" />
</mat-form-field>
