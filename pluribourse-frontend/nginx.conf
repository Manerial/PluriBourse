server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE stream — must not be buffered or idle-timed out like a normal request. The `^~` modifier
    # makes this longest-prefix match final: it wins over /api/ regardless of order and cannot be
    # shadowed by a later regex location. Kept above /api/ for readability. Story 2.11 (SCP 2026-09-07).
    location ^~ /api/sse/ {
        proxy_pass http://backend:8080/api/sse/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080/api/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
