# Prod profile — default when running via Docker Compose
# Springdoc disabled — /swagger-ui.html returns 404 (AC5)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
# PrinterBridge (story 3.11) — fixed port (PrinterBridge Main.PORT), reached via Docker's host gateway
printerbridge.base-url=http://host.docker.internal:7420
