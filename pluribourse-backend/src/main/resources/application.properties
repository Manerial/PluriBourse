spring.application.name=pluribourse

# Single source of truth for the API prefix — controllers and security matchers are declared relative to it
server.servlet.context-path=/api

# Datasource — URL uses Docker service name 'db' in prod; overridden to localhost in dev profile
spring.datasource.url=jdbc:mariadb://db:3306/${DB_NAME}
spring.datasource.username=pluribourse
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA — Liquibase manages the DDL; Hibernate must NOT alter the schema
spring.jpa.hibernate.ddl-auto=validate

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Spring Session JDBC — sessions survive container restarts (FR-066)
spring.session.store-type=jdbc
# Idle timeout (FR-066): 1 h, single source of truth. Volunteers are continuously active during an event, so a request refreshes it; short enough that a genuinely abandoned session dies quickly.
spring.session.timeout=PT1H
# Let Liquibase create the Spring Session tables (changeset 002); do not auto-create
spring.session.jdbc.initialize-schema=never

# i18n — MessageSource for PDF generation and backend messages
spring.messages.basename=messages

# Virtual threads Java 21 — reduces memory pressure on RPi 4 under concurrent POS load
spring.threads.virtual.enabled=true

# Actuator — health endpoint only, no details exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# POS inactive-terminal detection (story 4.9, FR-110 / FR-066)
# Durations, smallest to largest: client heartbeat 60 s < dead-threshold PT3M (~3 missed beats)
# << spring.session.timeout=PT1H. dead-threshold is the only value likely to need tuning — bump it
# to PT5M without a redeploy if the venue wifi is flaky.
pos.basket.heartbeat.dead-threshold=PT3M
pos.basket.reaper.interval=PT2M
pos.basket.reaper.enabled=true

# SSE keepalive (story 2.11, SCP 2026-09-07) — a bare SseEmitter writes no bytes between phase
# events, so an idle reverse-proxy would drop the SSE connection and the client would treat that as
# a logout. A scheduled SSE comment keeps intermediaries from seeing the socket as dead.
# Durations, smallest to largest: keepalive PT20S < 60 s (common proxy proxy_read_timeout default)
# < 3600s (proxy_read_timeout of the nginx /api/sse/ block). Independent of the SseEmitter
# constructor timeout (30 min absolute request lifetime — native EventSource reconnect handles it).
sse.keepalive.interval=PT20S
sse.keepalive.enabled=true
