spring.application.name=pluribourse

# Datasource — URL uses Docker service name 'db' in prod; overridden to localhost in dev profile
spring.datasource.url=jdbc:mariadb://db:3306/${DB_NAME}
spring.datasource.username=pluribourse
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA — Liquibase manages the DDL; Hibernate must NOT alter the schema
spring.jpa.hibernate.ddl-auto=validate

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Spring Session JDBC — sessions survive container restarts (FR-066)
spring.session.store-type=jdbc
# Absolute timeout: covers a full event day (4-6h) with margin; Spring Session takes precedence over server.servlet.session.timeout
spring.session.timeout=PT8H
# Idle timeout: auto-logout after 2h of inactivity on shared volunteer workstations
server.servlet.session.timeout=2h
# Let Liquibase create the Spring Session tables (changeset 002); do not auto-create
spring.session.jdbc.initialize-schema=never

# i18n — MessageSource for PDF generation and backend messages
spring.messages.basename=messages

# Virtual threads Java 21 — reduces memory pressure on RPi 4 under concurrent POS load
spring.threads.virtual.enabled=true

# Actuator — health endpoint only, no details exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
