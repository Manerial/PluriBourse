# Dev profile — used with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# MariaDB must be running locally (or via: docker compose up db -d)
spring.datasource.url=jdbc:mariadb://localhost:3306/${DB_NAME:pluribourse}
spring.datasource.password=password_dev
# Springdoc OpenAPI — enabled in dev only (AC4)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
# DevTools hot reload
spring.devtools.restart.enabled=true
# Spring Session tables auto-created for embedded DBs in dev (H2 in tests)
spring.session.jdbc.initialize-schema=embedded
