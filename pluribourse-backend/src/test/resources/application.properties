# Test configuration — H2 in-memory with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate must not alter schema — Liquibase handles it
spring.jpa.hibernate.ddl-auto=none

# Run Liquibase migrations on H2 for integration tests
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-test.xml
spring.liquibase.drop-first=true

# Spring Session — use embedded schema creation for H2
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# i18n — MessageSource basename (same as main; explicit to survive classpath priority ordering)
spring.messages.basename=messages

# Disable Actuator security for tests
management.endpoints.web.exposure.include=health

# Suppress Springdoc in tests
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# PrinterBridge (story 3.11) — safe default so the context always starts; tests that exercise
# PrinterBridge interaction override this via @DynamicPropertySource to point at a local double.
printerbridge.base-url=http://localhost:7420

# POS inactive-terminal reaper (story 4.9) — disabled in tests so the @Scheduled sweep never fires
# on its own during the ordered story-board ITs. PosBasketReaperIT re-enables it for its own
# context (@TestPropertySource) and invokes the sweep method directly. The two durations are kept
# defined so the @Value / @Scheduled placeholders always resolve.
pos.basket.reaper.enabled=false
pos.basket.heartbeat.dead-threshold=PT3M
pos.basket.reaper.interval=PT2M
