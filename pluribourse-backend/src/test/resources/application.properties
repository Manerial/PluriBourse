# Test configuration — H2 in-memory with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate must not alter schema — Liquibase handles it
spring.jpa.hibernate.ddl-auto=none

# Run Liquibase migrations on H2 for integration tests
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-test.xml
spring.liquibase.drop-first=true

# Spring Session — use embedded schema creation for H2
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

# Disable Actuator security for tests
management.endpoints.web.exposure.include=health

# Suppress Springdoc in tests
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
