# Story 5-1 (flux de solde des vendeurs) créée : point d'entrée du sprint choisi après clarification avec l'utilisateur — l'ordre naturel pointait vers 2-7 (backlog), bloquée par sa dépendance sur 5.1 elle-même ET sur une story de bilan d'édition PDF (Epic 5, backlog) ; 5.1 est la première story réalisable de l'Epic 5, qui passe en in-progress. Nouveau package backend `org.pluribourse.domain.payout` (entité `Settlement`, statut SETTLED/UNCLAIMED, absence de ligne = UNSETTLED implicite — pas de colonne ajoutée sur `seller_profiles`), migration 024, `SettlementService`/`SettlementController` (`/settlements`, partagé ADMIN+VOLUNTEER sans `@PreAuthorize`, même patron que `SellerController`). Réutilise `ItemPricing.computeTotal` (lot-aware) et en extrait `computeNetPayout` (jusqu'ici dupliqué en privé dans `DepositSlipRenderer`) pour une seule vérité de calcul de commission. Trois écarts actés avec l'utilisateur avant dev (aucun ne nécessite de nouvelle story) : (1) AC 6 d'epics.md (bouton « Imprimer le bilan de vente ») différé en intégralité à la Story 5.2 — celle-ci n'existe pas encore, ajouter un bouton non fonctionnel violerait la philosophie « pas d'implémentation à moitié faite » ; (2) `resolveVolunteerLandingPath` change l'atterrissage Post-vente de `/volunteer/deposit` vers `/volunteer/settlement` (conforme à EXPERIENCE.md) — régression assumée sur la réimpression de bordereau (Story 3.6, done), compensée par un lien explicite depuis la page reversements puisque les bénévoles n'ont aucun menu de navigation ; un test existant d'`app-layout.component.spec.ts` encodant l'ancien comportement devra être corrigé, pas juste étendu ; (3) l'accessibilité `/admin/settlement` en phase Clôturée annoncée par EXPERIENCE.md n'est pas atteignable avec l'architecture actuelle (`EditionService.getActiveEdition()` exclut structurellement `CLOSED` de `PhaseType.ACTIVE`, une limite déjà présente pour toutes les pages admin, pas une régression introduite ici) — périmètre réduit à Post-vente uniquement, résolution de l'accès post-clôture déférée à la Story 2.7 ou une story dédiée. Statut → ready-for-dev. Story 5-1 implémentée (dev-story) : package backend `org.pluribourse.domain.payout` complet (migration 024, `Settlement`/`SettlementService`/`SettlementController`), `ItemPricing.computeNetPayout` extrait et dédupliqué depuis `DepositSlipRenderer`, `ItemRepository.findAllByEditionIdAndSoldTrue`. `SettlementIT` (8 scénarios E2E). Frontend : `SettlementListComponent` partagé admin/bénévole (`features/settlement/`), `settlement-phase.guard`, `resolveVolunteerLandingPath` Post-vente → `/volunteer/settlement`, lien sidebar admin, i18n FR/EN complet. Aucun écart par rapport au plan de la story (les trois déjà actés en `create-story` restent inchangés). 391/391 tests backend, 550/550 tests frontend, build de production sans erreur, aucune régression. Statut → review. Revue de code (bmad-code-review, Blind Hunter + Edge Case Hunter + Acceptance Auditor) : Acceptance Auditor confirme 0 violation d'AC. 2 decision-needed résolues avec l'utilisateur (deleteCascade sur fk_settlements_seller_profile remplacé par un blocage explicite dans SellerService.delete() ; solder à 0,00€ laissé tel quel, AC 2 l'autorise explicitement). 10 patch appliqués (race TOCTOU double-solde, @Digits + normalisation d'échelle sur SettleDto, requête scoping vendeur pour éviter un scan complet d'édition, montant négatif bloqué côté client, formulaire de solde fermé après Non réclamé, JavaDoc persistSettlement, imports SettlementIT nettoyés, 2 nouveaux scénarios SettlementIT IDOR + validation bean, 2 nouveaux tests frontend), 1 defer (pas de trace de l'acteur d'un solde), 9 rejetés comme bruit. 393/393 tests backend, 552/552 tests frontend, aucune régression. Statut → done. SaleConcurrencyIT (Testcontainers MariaDB, deux threads TransactionTemplate concurrents sur PosBasketService.validate) a révélé un écart réel jamais détectable sous H2 — sous MariaDB, l'erreur native 1020 (conflit d'écriture concurrente) est traduite par Hibernate en SnapshotIsolationException/JpaSystemException, pas en ObjectOptimisticLockingFailureException, donc jamais capturée par le code existant (transaction bien annulée, mais sans le 409 propre attendu par l'AC 3). Conformément à la garde explicite de la story, l'écart a été documenté et soumis à l'utilisateur avant toute modification de code de production ; l'utilisateur a choisi de corriger PosBasketService.validate dans le périmètre de cette story (catch élargi au cas MariaDB, sans sur-capture générique). SaleConcurrencyIT stable sur 2/2 exécutions contre MariaDB réel, 365/365 tests backend (H2), aucune régression. Revue de code (bmad-code-review, Blind Hunter + Edge Case Hunter + Acceptance Auditor) : 0 decision-needed, 3 patch appliqués — (1) le guard "sans Docker" ne skippait pas proprement (`@Testcontainers` démarre le conteneur via son `BeforeAllCallback`, exécuté avant tout `@BeforeAll` utilisateur, donc `Assumptions.assumeTrue` dans `requireDocker()` s'exécutait trop tard et la classe partait en erreur sans Docker plutôt qu'en skip) — corrigé via `@Testcontainers(disabledWithoutDocker = true)`, garde manuelle devenue redondante retirée ; (2) commentaire de garde ajouté contre un futur `@Transactional` accidentel sur la méthode de test (casserait la visibilité des fixtures entre threads) ; (3) détection de `SnapshotIsolationException` durcie face à un enrobage futur — tentative initiale (`NestedExceptionUtils.getMostSpecificCause`) elle-même boguée (retourne la cause la plus profonde, pas la première occurrence du type recherché, donc régressait le correctif), détectée par re-test immédiat et corrigée par un parcours manuel de la chaîne de causes. 3 defer documentés dans `deferred-work.md` (couverture multi-articles de la nouvelle branche non prouvée, absence de CI déjà actée au niveau projet, absence de handler RFC7807 générique pour `JpaSystemException`). 1 faux positif de l'Acceptance Auditor écarté avec transparence (résumé de spec condensé lui avait fait manquer une section Dev Notes existante). Suite complète re-validée après patches : 365/365 backend, aucune régression. Statut → done. Re-revue (round 2) demandée par l'utilisateur : les 3 patches confirmés réellement présents et corrects par l'Acceptance Auditor. 1 patch supplémentaire appliqué (ExecutorService en try-with-resources, future.get() du thread principal pouvait sauter shutdown() si interrompu), 2 defer (pas de test unitaire rapide pour isCausedBy malgré sa régression déjà prouvée dans ce cycle — tension avec la philosophie « pas de tests de service isolés » ; test incapable de distinguer en boîte noire quelle branche catch a intercepté — vérifié empiriquement non-applicable aujourd'hui via les logs MariaDB 1020, risque réel seulement pour un futur changement Hibernate/driver), 1 faux positif écarté (SaleConcurrencyIT n'étend pas IntegrationTest — déviation explicitement documentée dans la Task de la story, pas un oubli). Suite complète re-validée : 365/365 backend, aucune régression. Statut → done (confirmé). Round 3 (re-review demandée par l'utilisateur, ciblée sur le patch try-with-resources) : patch confirmé correct par Blind Hunter + Acceptance Auditor (portée des variables, ordre assertions/close(), pas de double-close). 0 patch, 0 nouveau defer — enrichissement du defer round 1 "panier multi-articles" (Acceptance Auditor : la boucle réutilise la même Session Hibernate après un échec de flush, réemploi non garanti par la spec JPA §3.4 — risque préexistant Story 4.2, hors périmètre AC 3, l'absence de vente partielle restant assurée dans tous les cas). Statut → done (confirmé 3x). Story 4-4 créée précédemment : après lecture complète de PosBasketService, les AC 1/2 de l'epic (409 + liste des articles en conflit, UX client) sont déjà entièrement implémentées et testées end-to-end depuis la Story 4.2 (branche `alreadySold`, `PosBasketIT` @Order 20) — cette story se concentre sur l'AC 3 (verrou optimiste `Item.@Version` sous concurrence réelle), dont la branche `ObjectOptimisticLockingFailureException` de `validate()` existe déjà mais n'avait jamais été exercée par un test (le test existant est séquentiel, pas concurrent). Ajoute `spring-boot-testcontainers`/`testcontainers:mariadb`/`testcontainers:junit-jupiter` (absents du pom.xml jusqu'ici) et une nouvelle classe `SaleConcurrencyIT` (hors `IntegrationTest`/H2, conteneur MariaDB réel, deux threads `TransactionTemplate` synchronisés par `CountDownLatch`) conformément à l'exigence explicite d'architecture.md (comportement de verrouillage H2 ≠ MariaDB). Deux écarts identifiés et documentés dans la story pour confirmation utilisateur avant dev : (1) la ligne « filet de sécurité UNIQUE en BDD » d'architecture.md est obsolète (`sold` est une simple colonne BOOLEAN, aucune contrainte UNIQUE applicable au design réel, `@Version` est déjà le mécanisme réel et suffisant) ; (2) le test à deux threads appelle `PosBasketService.validate` directement (bypass MockMvc/contrôleur) pour obtenir un contrôle déterministe des frontières de transaction — nécessité technique documentée comme une seconde exception à la philosophie de test E2E-par-contrôleur de CLAUDE.md, distincte de l'exception déjà nommée (client externe type PrinterBridgeClient). Garde `Assumptions.assumeTrue(DockerClientFactory...)` prévue pour que ce nouveau test skip proprement (pas d'échec dur) sur une machine sans Docker, le projet n'ayant aucun pipeline CI pour l'instant. Aucune modification de code de production ni de frontend anticipée. Story 4-2 (gestion du panier & validation du paiement) — revue de code terminée (bmad-code-review, Blind Hunter + Edge Case Hunter + Acceptance Auditor) : 1 finding initial (NPE potentielle sur item incomplet) invalidé après investigation avec l'utilisateur — faux positif, Item.price est garanti non-null pour tout article hors-lot (CreateItemDto @NotNull, aucune opération ne retire un article d'un lot) — 0 decision-needed final, 11 patch appliqués (bug AC 6 monnaie à 0€, validation serveur du montant remis, race sur addItem, repli de conflit qui blâmait tout le panier, FK sale_id sans onDelete, arrondi monnaie frontend, accessibilité PaymentDialogService, loadBasket en ngOnInit, garde anti-double-clic, JavaDoc validate(), tests CHECK + montant insuffisant), 3 defer (édition active non vérifiée sur le panier → 2.8, pas de test de concurrence réel → 4.4, BasketItem sans @Version), 7 rejetés comme bruit — 362/362 backend, 515/515 frontend, aucune régression — statut done. Story 4-3 (gestion des lots au POS) créée : regroupement visuel des articles de lot dans le panier (FR-046/047/048/081), explicitement reporté par la Story 4.2 (`ScanResultDto` n'avait pas de champ `lotId`, le calcul du total lot-aware était déjà correct). Ajoute `lotId` à `ScanResultDto`, un nouveau `LotGroupDto` (compteur X/N scannés + prix global du lot) dans `BasketDto`, et un endpoint `DELETE /pos/baskets/{basketId}/lots/{lotId}` pour retirer un lot entier — aucune migration, aucun changement du modèle de calcul (`ItemPricing`, déjà correct depuis 4.2). Validation qualité (checklist create-story) avant dev : la note « incohérence du mockup » sur le prix individuel de lot était factuellement imprécise — la règle CSS `.lot-article-list .article-row__price` de `mock-pos-caisse.html` est morte (aucun élément correspondant dans le markup, ni dans ce mockup ni dans `mock-pos-caisse-lot-complet.html` ; le montant cité était le sous-total du groupe, pas un prix individuel) — corrigée dans la story, décision finale (aucun prix individuel, sous-total = prix global) inchangée. Story 4-3 implémentée (dev-story) : `buildLotGroups` dans `PosBasketService` (réutilise `ItemPricing.distinctByLot`), `removeLot` (garde phase → ownership → 404 `basket-lot-not-found` → suppression groupée), endpoint `DELETE /pos/baskets/{basketId}/lots/{lotId}`. Bug non anticipé détecté et corrigé pendant l'implémentation (avant tout run de test) : `buildLotGroups` filtrait `scannedCount` via `item.getLot().getId()` sans vérifier la nullité pour les articles hors-lot — NPE potentielle sur tout panier mixte, corrigée par un garde `item.getLot() != null`. Frontend : panier restructuré en blocs par lot (compteur, sous-total, états succès/avertissement via tokens `--pb-success-container`/`--pb-warning-container`, `<app-notification-inline>` réutilisé). `PosBasketIT` étendu (second lot « Lot Retrait », nouveau scénario de retrait @Order 19, renumérotation +1 jusqu'à l'ancien 22, deux tests de garde renommés en « five endpoints »). 364/364 tests backend, 513/513 tests frontend, aucune régression. Statut → review. Revue de code terminée (bmad-code-review, Blind Hunter + Edge Case Hunter + Acceptance Auditor) : Acceptance Auditor confirme conformité totale à la spec, aucune violation. 0 decision-needed, 1 patch appliqué (incohérence `==`/`===` sur `item.lotId` dans le template, `pos-page.component.html:18`), 3 defer (race TOCTOU non-atomique dans `removeLot` → même catégorie que la Story 4.4, logique de filtrage lot/hors-lot dans le template plutôt que précalculée, bouton « Retirer le lot entier » sans `[disabled]` lié à `removeInFlight` — patron déjà en place depuis 4.2), 9 rejetés comme bruit (N+1 `Lot.items` déjà documenté et accepté dans la story, `deleteAll` sans FETCH intentionnel, écart de comptage de tests basé sur un historique non vérifiable, etc.) — 513/513 frontend toujours au vert après le patch, aucune régression — statut done. Story 4-5 (impression de la facture acheteur) créée : nouveau renderer PDF `InvoiceRenderer` + méthode `DocumentPrintService.buildInvoiceJob` (même patron que le bordereau de dépôt, Story 3.6), nouveau service `PosInvoicePrintService`/contrôleur `PosSaleController` (`POST /pos/sales/{saleId}/invoice/print`) — `Sale` n'a pas de collection `items`, nouvelle requête `ItemRepository.findAllBySaleIdOrderById` (JOIN FETCH lot) exploitant la FK existante `Item.sale`. Deux décisions de conception actées sans nécessiter de confirmation utilisateur (aucun conflit avec un document de planification, contrairement aux écarts de la Story 4.4) : (1) pas de `PhaseGuard` sur l'impression — une `Sale` est un enregistrement immuable une fois créée, contrairement aux `Item` encore modifiables en phase Dépôt ; (2) fenêtre d'affichage du bouton de 30 secondes ajoutée comme AC à part entière bien qu'absente d'epics.md, car explicitement normative dans EXPERIENCE.md (maquettes UX). Guardrail explicite dans les Dev Notes contre le piège `LazyInitializationException` déjà rencontré deux fois sur ce module d'impression (Stories 3.5/3.6) : extraire `editionName`/`associationName`/`documentLocale`/`soldAt` en valeurs simples avant de construire le `PrintJob`, ne jamais capturer `Sale`/`Edition` eux-mêmes dans la closure. Nouvelle classe de test `InvoicePrintingIT` (calquée sur `DepositSlipPrintingIT`), pas d'extension de `PosBasketIT` (scénario métier distinct). Frontend : capture enfin le `SaleDto` actuellement jeté par `openPaymentDialog()`, ajoute le timer 30s via le patron `DestroyRef`/`setTimeout` déjà utilisé par `scanner-input.component.ts`. Story 4-5 implémentée (dev-story) : `InvoiceRenderer` (nouveau, OpenPDF, autonome de `DepositSlipRenderer`), `DocumentPrintService.buildInvoiceJob`, `PosInvoicePrintService`/`PosSaleController` (`POST /pos/sales/{saleId}/invoice/print`), `ItemRepository.findAllBySaleIdOrderById`. Deux correctifs pendant l'implémentation : (1) l'ajout du champ `invoiceRenderer` à `DocumentPrintService` (`@RequiredArgsConstructor`) a changé l'arité de son constructeur, cassant l'instanciation manuelle dans `DepositSlipPrintingIT` (Story 3.6, done) — corrigé en autowirant `InvoiceRenderer` dans cette classe de test, aucun changement de comportement testé ; (2) le test de réimpression (AC 4) était flaky en suite complète (course entre le thread de test et le thread consommateur de la file suspendant l'imprimante après le premier envoi) — rendu déterministe via `waitUntil` + `POST /admin/print-queue/{id}/discard` avant le second appel plutôt que deux appels consécutifs sans synchronisation. Frontend : capture du `SaleDto` de `validate()` dans un signal `lastSale`, timer nommé `INVOICE_BUTTON_VISIBLE_MS` (30s, patron `DestroyRef`/`scanner-input.component.ts`), garde explicite contre une réinitialisation de `lastSale` par un scan pendant la fenêtre. 377/377 tests backend, 519/519 tests frontend, aucune régression. Statut → review. Revue de code terminée (bmad-code-review, Blind Hunter + Edge Case Hunter + Acceptance Auditor) : Acceptance Auditor confirme conformité totale aux 7 AC, 0 violation. 0 decision-needed, 2 patch appliqués (bean réel `DepositSlipRenderer` autowiré dans `InvoicePrintingIT` au lieu de `null`, helper `printPdf` extrait dans `DocumentPrintService`), 4 defer (race TOCTOU `isAvailable`/`submit` préexistante depuis 3.5/3.6, scoping `findAllBySaleIdOrderById` non prouvé par une seconde vente, verrou anti-double-clic frontend non testé — même lacune que 4.2/4.3), 9 rejetés comme bruit (conventions déjà établies du projet). 377/377 backend re-validé après patchs, aucune régression. Statut → done. Story 2-8 (annulation du panier lors d'une transition de phase — côté serveur) créée le 2026-08-13 : point d'entrée choisi après clarification avec l'utilisateur — l'ordre naturel du sprint status pointait vers 2-7 (backlog), mais 2-7 dépend de la Story 5.1 (encore backlog) et n'est pas réalisable ; 4-6 aurait été le choix suivant mais dépend explicitement de 2-8 elle-même (émission SSE `basket-cancelled` côté serveur, confirmé absente du code par grep) ; l'utilisateur a choisi de faire 2-8 d'abord, dont la dépendance sur la Story 4.2 (entité Basket) est désormais levée (4.2 est done). Modifie `EditionService.savePhaseThenSendEvent` (point d'accroche unique déjà partagé par `advancePhase`/`rollbackPhase`) pour supprimer tous les `Basket` de l'édition à chaque transition de phase (les deux directions) et diffuser un nouvel événement SSE `basket-cancelled` ({editionId, newPhase}) uniquement si au moins un panier existait — même patron transactionnel `afterCommit` que `phase-changed` depuis la Story 2.6 (atomicité gratuite : les gardes métier existantes s'exécutent avant ce point, donc une transition refusée n'annule jamais de panier). Écart documenté (non bloquant, ne nécessite pas de confirmation utilisateur) : le payload `{reason: "phase-changed"}` documenté pour `basket-cancelled` dans architecture.md est obsolète face à l'AC explicite d'epics.md (`{editionId, newPhase}`) — epics.md fait foi. Nouveau test `PosBasketCancellationIT` prévu (storyboard dédié couvrant les deux directions + le cas silencieux sans panier actif). Aucun changement frontend (réception de l'événement = Story 4.6, qui dépend de celle-ci). Statut → ready-for-dev. Story 2-8 implémentée (dev-story) : `BasketRepository.findAllByEditionId` (nouveau), `BasketCancelledEventDto` (nouveau, patron `PhaseChangedEventDto`), `EditionService.savePhaseThenSendEvent` modifiée pour purger tous les `Basket`/`BasketItem` de l'édition à chaque transition de phase (avance ET retour arrière, un seul point d'accroche) et diffuser `basket-cancelled` ({editionId, newPhase}) uniquement si des paniers existaient, dans le même `afterCommit` que `phase-changed` — atomicité gratuite. Résout en effet de bord le defer documenté dans la revue de la Story 4.2 (2026-07-31) sur `requireOwnedBasket()` ne vérifiant pas l'édition active. Nouveau test `PosBasketCancellationIT` (4 tests, une connexion SSE fraîche par scénario pour des assertions non ambiguës). Régression légitime non anticipée détectée par la suite complète et corrigée : `PosBasketIT.phase_guard_rejects_all_five_endpoints_once_sale_phase_ends` (@Order 23) attendait 422 sur `addItem` après sortie de la phase Vente, mais reçoit désormais 404 `basket-not-found` — cet endpoint vérifie l'ownership du panier avant la phase (contrairement aux 4 autres du même test), et le panier vient d'être supprimé par cette story ; réponse plus exacte que l'ancienne. Le Javadoc de ce test annonçait déjà ce changement à venir comme le périmètre de la Story 2.8. Méthode renommée, assertion et Javadoc mis à jour. 381/381 tests backend (0 échec), aucune régression restante. Aucun changement frontend. Statut → review. Revue de code terminée (bmad-code-review, Blind Hunter + Edge Case Hunter + Acceptance Auditor) : 0 decision-needed, 3 patch appliqués (AC 4 atomicité sur transition refusée, AC 5 portée multi-paniers, AC 1 suppression directe des BasketItem — tous des trous de couverture de test, aucun bug de production), 5 defer documentés dans deferred-work.md (races TOCTOU à fenêtre étroite, dépendance cross-domaine EditionService→BasketRepository cohérente avec le précédent ItemRepository, deleteAll non-bulk négligeable), 11 rejetés comme bruit (dont 2 faux positifs vérifiés contre le code source réel). PosBasketCancellationIT étendue de 4 à 6 tests. 383/383 tests backend re-validés, aucune régression. Statut → done.
# Story 6-1 : catalogue d'articles filtrable/triable — revue de code terminée (bmad-code-review) : 1 decision-needed résolue (pivot de scope vers édition active uniquement, consultation des éditions passées reportée à une nouvelle story), 10 patch appliqués, 1 defer, 3 rejetés comme bruit — ARCH-005 corrigé en amont (JPageFlow 1.7.0) — 328/328 backend, 462/462 frontend, aucune régression — statut done. Sprint change proposal 2026-07-29 : nouvelle story 6-2 (consultation catalogue édition archivée, FR-102), dépend de la Story 2.7 — ajoutée en backlog. 2026-07-30 : en cherchant la prochaine story à développer, dépendance cachée découverte sur 2.7 (CA suppose Story 5.1 solde vendeurs + génération bilan d'édition PDF, toutes deux backlog) — documentée sur 2.7 dans epics.md et sprint-status.yaml, aucun artefact de planification restructuré au-delà de cette documentation. Dépendance cachée également découverte sur 2.8 (CA suppose l'entité panier POS créée par la Story 4.2, Epic 4 non démarré) — documentée de la même façon, aucun lien entre 2.7 et 2.8 elles-mêmes. Story 4-1 (composant scanner & scan d'articles) créée : première story de l'Epic 4 (Point de vente), épic passé en in-progress. Story 4-1 implémentée puis revue en 2 passes (bmad-code-review) : nouveau package backend `pos` (scan uniquement), route `/volunteer/pos` + garde de phase Vente côté front. Round 1 : 2 decision-needed résolues, 8 patch appliqués, 2 defer. Round 2 (diff patché) : 2 des correctifs du round 1 avaient eux-mêmes introduit de nouveaux défauts (collage non câblé, buffer trop agressivement vidé) — 7 patch supplémentaires appliqués (collage réellement fonctionnel, vidage du buffer découplé du re-focus, protection anti-vol-de-focus étendue aux widgets ARIA, garde de réentrance sur le scan, logique de garde de phase partagée extraite, Javadoc corrigée, track par itemId), 2 defer supplémentaires — 340/340 backend, 495/495 frontend, aucune régression — statut done (confirmé). Story 4-2 (gestion du panier & validation du paiement) créée : introduit les entités persistées `Basket`/`BasketItem`/`Sale` (jusqu'ici le panier de la Story 4.1 était purement un signal client, volontairement non persisté) — migration Liquibase 021, verrou optimiste existant (`Item.@Version`) réutilisé pour le conflit de vente concurrente (409 + liste des articles en conflit), calcul du total rendu lot-aware dès cette story (prix nul sur les items de lot) sans implémenter le regroupement visuel des lots (Story 4.3). `GET /pos/scan` (Story 4.1) laissé inchangé plutôt que retiré, pour ne pas toucher les tests d'une story déjà done. Dépendances 2.8/4.6 désormais satisfaisables après cette story. Revue qualité indépendante (contexte frais, checklist create-story) : 2 manques critiques trouvés et corrigés dans la story — garde de phase Vente absente sur `removeItem`/`validate` (risque de valider un paiement hors phase, aucune annulation auto du panier au changement de phase avant 2.8) et affichage cassé du prix unitaire pour un article de lot (`price` nul non géré côté template) — plus plusieurs améliorations mineures (raccourci clavier somme remise, référence de code corrigée, borne sur le montant remis, `@Mapping` MapStruct explicite). Story 4-2 implémentée (dev-story) : nouveau package backend `pos.{entity,repository,exception,service,controller}` (Basket/BasketItem/Sale persistés, migration 021), garde de phase Vente explicite sur les 4 endpoints, total lot-aware, conflit de vente concurrente (409 + liste). Bug non anticipé découvert et corrigé pendant l'implémentation : lecture de `Basket.items` (collection JPA lazy) non fiable après un add/delete dans la même transaction — remplacée par une requête explicite avec JOIN FETCH. Frontend : panier persisté restauré au montage (NFR-006), `payment-dialog.component` (CDK Dialog), affichage conditionnel du prix pour les articles de lot. Bug non anticipé côté frontend : `viewChild('#confirmButton')` sans `read: ElementRef` se résolvait vers le composant `MatButton` (MDC) plutôt que l'élément DOM — corrigé. 360/360 tests backend, 515/515 tests frontend, aucune régression. Statut → review.
# Story 4-6 (gestion du changement de phase dans le composant POS — côté client) créée le 2026-08-14 : point d'entrée choisi après clarification avec l'utilisateur — l'ordre naturel du sprint status pointait vers 2-7 (backlog), mais 2-7 reste bloquée par sa dépendance sur la Story 5.1 (backlog) ; 4-6 était la story suivante réalisable, sa dépendance sur la Story 2.8 (émission SSE `basket-cancelled` côté serveur) étant désormais levée (2.8 est done). Story strictement frontend — aucun changement backend, tout le nécessaire (payload `{editionId, newPhase}`, portée globale du broadcast) a déjà été livré par la Story 2.8. Extraction prévue de la logique de connexion `EventSource` commune de `SseService` (`phaseChanges()`/nouvelle `basketCancelled()` partagent un helper privé `listen<T>()`) plutôt que de dupliquer le bloc de gestion d'erreur/reconnexion. Ajout d'un signal `disabled` sur `ScannerInputComponent` (patron `input()` déjà utilisé par `EmptyStateComponent`), désactivation définitive jusqu'à rechargement de page (aucune réactivation JS). Piège documenté et couvert par une tâche dédiée : une requête déjà en vol (`onScan`/`removeItem`/`removeLot`) au moment de l'annulation ne doit pas ressusciter le panier à sa résolution — garde `scannerDisabled()` ajoutée avant chaque écriture post-await. Deux écarts de documentation relevés sans nécessiter de confirmation utilisateur (non bloquants, déjà tranchés par la Story 2.8 pour le premier) : le payload `basket-cancelled` d'architecture.md (`{reason: "phase-changed"}`) est obsolète face au payload réel `{editionId, newPhase}` ; le tag `UX-DR21` cité par epics.md ne correspond à aucune ancre trouvable dans les docs UX (texte du toast néanmoins confirmé mot pour mot dans EXPERIENCE.md). Statut → ready-for-dev. Story 4-6 implémentée (dev-story) : `SseService.listen<T>()` extrait (partagé par `phaseChanges()`/nouvelle `basketCancelled()`), signal `disabled` sur `ScannerInputComponent`, `PosPageComponent.onBasketCancelled()` (vide panier + `lastScanIssue`, désactive le scanner, toast persistant), garde `scannerDisabled()` ajoutée sur les deux branches (succès/erreur) de `onScan`/`removeItem`/`removeLot` pour qu'une requête en vol au moment de l'annulation ne résuscite ni le panier ni n'écrase le toast persistant par un message d'erreur périmé. Aucun écart par rapport au plan de la story, aucun changement backend. 526/526 tests frontend, build de production sans erreur, aucune régression. Statut → review. Revue de code (bmad-code-review, Blind Hunter + Edge Case Hunter + Acceptance Auditor) : Acceptance Auditor confirme 0 violation d'AC. 0 decision-needed, 3 patch appliqués (test AC 3 `EMPTY`→`NEVER` — erreur introduite lors de la passe de validation de la story, garde `scannerDisabled()` ajoutée sur `openPaymentDialog()` pour empêcher un 404 tardif d'écraser le toast persistant, 2 tests de régression ajoutés sur `removeItem`/`validate()`), 3 defer documentés dans `deferred-work.md` (deux connexions SSE simultanées, requêtes HTTP en vol non abortées, `scannerDisabled` réinitialisable par navigation SPA interne — aucun préjudice fonctionnel identifié dans les trois cas), 8 rejetés comme bruit (5 faux positifs vérifiés contre le code source réel). 528/528 tests frontend re-validés après patchs, aucune régression. Statut → done. Re-revue (round 2) demandée par l'utilisateur : 3 nouveaux patch appliqués (garde anti-résurrection manquante sur `loadBasket()` — trou réel du round 1, renommage `scannerDisabled`→`basketCancelled`, test de régression manquant sur `removeLot`), 0 nouveau defer, 12 rejetés comme bruit (redites du round 1 déjà vérifiées fausses + confirmation que `printInvoice()` reste intentionnellement actif après annulation par design Story 4.5). 529/529 tests frontend re-validés, aucune régression. Statut → done (confirmé).
