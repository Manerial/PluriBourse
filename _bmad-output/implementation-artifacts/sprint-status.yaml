ementListComponent`/`SettlementController`/`SettlementService` n'a été touché — la vérification visuelle par un humain de `/admin/settlement` (CLAUDE.md § Interaction utilisateur) reste en attente, `dev-story` ayant tourné sans supervision interactive. 440/440 tests backend (422 + 18 nouveaux), 585/585 tests frontend (575 + 10 nouveaux), aucune régression. Statut → review. Revue de code (bmad-code-review, Blind Hunter + Edge Case Hunter + Acceptance Auditor) : Acceptance Auditor confirme 0 violation d'AC, 0 dérive Tasks/code. 0 decision-needed, 1 patch appliqué (garde explicite remplaçant l'assertion non-null `currentEdition()!.id` dans `printEditionReport()` — course SSE étroite mais réelle pouvant lever une TypeError interceptée mais avec un toast trompeur), 5 defer (TOCTOU deux-transactions déjà présent depuis 5.3, prolifération `*NotAllowedException` déjà établie sur 6 classes, duplication renderer/print-service déjà établie sur les 5 classes du module impression, branche `default` non testée déjà acceptée depuis 5.3), 12 rejetés comme bruit après vérification directe dans le code (`Sale.total` scale=2 exclut tout risque d'arrondi, `@PreAuthorize` déjà au niveau classe, packages/conventions déjà établis). 586/586 tests frontend re-validés après patch, aucune régression. Statut → done.
